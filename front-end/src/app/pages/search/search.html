<div class="search-container">
  <div class="search-header">
    <h1 class="search-title">🔍 Cercar</h1>
    <p class="search-subtitle">Troba el que busques a ErasFlatFinder</p>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-navigation">
    <button
      class="tab-button"
      [class.active]="activeTab() === 'universitats'"
      (click)="selectTab('universitats')"
    >
      🏫 Universitats
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab() === 'usuaris'"
      (click)="selectTab('usuaris')"
    >
      👥 Usuaris
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab() === 'grups'"
      (click)="selectTab('grups')"
    >
      👨‍👩‍👧‍👦 Grups
    </button>
  </div>

  <!-- Content Section -->
  <div class="tabs-content">
    <app-search-universitats *ngIf="activeTab() === 'universitats'"></app-search-universitats>
    <app-search-usuaris *ngIf="activeTab() === 'usuaris'"></app-search-usuaris>
    <app-search-grups *ngIf="activeTab() === 'grups'"></app-search-grups>
  </div>
</div>
