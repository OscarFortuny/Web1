<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>{{ isLoginMode() ? '🔐 Iniciar Sessió' : '📝 Registrar-se' }}</h1>
      <p>{{ isLoginMode() ? 'Accedeix al teu compte d\'ErasFlatFinder' : 'Crea el teu compte a ErasFlatFinder' }}</p>
    </div>

    <!-- Error/Success Messages -->
    <div class="message error" *ngIf="errorMessage()">
      ❌ {{ errorMessage() }}
    </div>
    <div class="message success" *ngIf="successMessage()">
      ✅ {{ successMessage() }}
    </div>

    <!-- Login Form -->
    <form *ngIf="isLoginMode()" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="username">Usuari</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="loginUsername"
          name="username"
          placeholder="El teu nom d'usuari"
        />
      </div>

      <div class="form-group">
        <label for="password">Contrasenya</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="loginPassword"
          name="password"
          placeholder="La teva contrasenya"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Carregant...' : 'Iniciar Sessió' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="!isLoginMode()" (ngSubmit)="onRegister()" class="login-form">
      <div class="form-row">
        <div class="form-group">
          <label for="reg-username">Usuari *</label>
          <input
            type="text"
            id="reg-username"
            [(ngModel)]="registerUsername"
            name="username"
            placeholder="Tria un usuari"
          />
        </div>

        <div class="form-group">
          <label for="reg-name">Nom complet *</label>
          <input
            type="text"
            id="reg-name"
            [(ngModel)]="registerName"
            name="name"
            placeholder="El teu nom"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-password">Contrasenya *</label>
          <input
            type="password"
            id="reg-password"
            [(ngModel)]="registerPassword"
            name="password"
            placeholder="Mínim 4 caràcters"
          />
        </div>

        <div class="form-group">
          <label for="reg-confirm">Confirmar contrasenya *</label>
          <input
            type="password"
            id="reg-confirm"
            [(ngModel)]="registerConfirmPassword"
            name="confirmPassword"
            placeholder="Repeteix la contrasenya"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-genere">Gènere *</label>
          <select id="reg-genere" [(ngModel)]="registerGenere" name="genere">
            <option value="">Selecciona...</option>
            <option value="Masculí">Masculí</option>
            <option value="Femení">Femení</option>
            <option value="Altre">Altre</option>
            <option value="Prefereixo no dir-ho">Prefereixo no dir-ho</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-language">Idioma preferit *</label>
          <select id="reg-language" [(ngModel)]="registerLanguage" name="language">
            <option value="">Selecciona...</option>
            <option value="Català">Català</option>
            <option value="Español">Español</option>
            <option value="English">English</option>
            <option value="Français">Français</option>
            <option value="Deutsch">Deutsch</option>
            <option value="Italiano">Italiano</option>
            <option value="Português">Português</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-local">Universitat d'origen *</label>
        <select id="reg-local" [(ngModel)]="registerLocalUniversity" name="localUniversity">
          <option value="">Selecciona la teva universitat...</option>
          <option *ngFor="let uni of universitats()" [value]="uni.universitat_id">
            {{ uni.name }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="reg-destination">Universitat de destí *</label>
        <select id="reg-destination" [(ngModel)]="registerDestinationUniversity" name="destinationUniversity">
          <option value="">Selecciona el teu destí ERASMUS...</option>
          <option *ngFor="let uni of universitats()" [value]="uni.universitat_id">
            {{ uni.name }}
          </option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Creant compte...' : 'Registrar-se' }}
      </button>
    </form>

    <div class="toggle-mode">
      <p *ngIf="isLoginMode()">
        No tens compte?
        <a (click)="toggleMode()">Registra't aquí</a>
      </p>
      <p *ngIf="!isLoginMode()">
        Ja tens compte?
        <a (click)="toggleMode()">Inicia sessió</a>
      </p>
    </div>
  </div>
</div>
