<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>{{ isLoginMode() ? '🔐 Iniciar Sesión' : '📝 Registrarse' }}</h1>
      <p>{{ isLoginMode() ? 'Accede a tu cuenta de ErasFlatFinder' : 'Crea tu cuenta en ErasFlatFinder' }}</p>
    </div>

    <!-- Error/Success Messages -->
    <div class="message error" *ngIf="errorMessage()">
      ❌ {{ errorMessage() }}
    </div>
    <div class="message success" *ngIf="successMessage()">
      ✅ {{ successMessage() }}
    </div>

    <!-- Login Form -->
    <form *ngIf="isLoginMode()" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="loginUsername"
          name="username"
          placeholder="Tu nombre de usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="loginPassword"
          name="password"
          placeholder="Tu contraseña"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="!isLoginMode()" (ngSubmit)="onRegister()" class="login-form">
      <div class="form-row">
        <div class="form-group">
          <label for="reg-username">Usuario *</label>
          <input
            type="text"
            id="reg-username"
            [(ngModel)]="registerUsername"
            name="username"
            placeholder="Elige un usuario"
          />
        </div>

        <div class="form-group">
          <label for="reg-name">Nombre completo *</label>
          <input
            type="text"
            id="reg-name"
            [(ngModel)]="registerName"
            name="name"
            placeholder="Tu nombre"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-password">Contraseña *</label>
          <input
            type="password"
            id="reg-password"
            [(ngModel)]="registerPassword"
            name="password"
            placeholder="Mínimo 4 caracteres"
          />
        </div>

        <div class="form-group">
          <label for="reg-confirm">Confirmar contraseña *</label>
          <input
            type="password"
            id="reg-confirm"
            [(ngModel)]="registerConfirmPassword"
            name="confirmPassword"
            placeholder="Repite la contraseña"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-genere">Género *</label>
          <select id="reg-genere" [(ngModel)]="registerGenere" name="genere">
            <option value="">Selecciona...</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
            <option value="Prefiero no decirlo">Prefiero no decirlo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-language">Idioma preferido *</label>
          <select id="reg-language" [(ngModel)]="registerLanguage" name="language">
            <option value="">Selecciona...</option>
            <option value="Español">Español</option>
            <option value="Català">Català</option>
            <option value="English">English</option>
            <option value="Français">Français</option>
            <option value="Deutsch">Deutsch</option>
            <option value="Italiano">Italiano</option>
            <option value="Português">Português</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-local">Universidad de origen *</label>
        <select id="reg-local" [(ngModel)]="registerLocalUniversity" name="localUniversity">
          <option value="">Selecciona tu universidad...</option>
          <option *ngFor="let uni of universitats()" [value]="uni.universitat_id">
            {{ uni.name }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="reg-destination">Universidad de destino *</label>
        <select id="reg-destination" [(ngModel)]="registerDestinationUniversity" name="destinationUniversity">
          <option value="">Selecciona tu destino ERASMUS...</option>
          <option *ngFor="let uni of universitats()" [value]="uni.universitat_id">
            {{ uni.name }}
          </option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>

    <div class="toggle-mode">
      <p *ngIf="isLoginMode()">
        ¿No tienes cuenta?
        <a (click)="toggleMode()">Regístrate aquí</a>
      </p>
      <p *ngIf="!isLoginMode()">
        ¿Ya tienes cuenta?
        <a (click)="toggleMode()">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
